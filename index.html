<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplitOne Status</title>
<meta name="description" content="Live availability for SplitOne. Checked every five minutes from GitHub's infrastructure.">
<meta name="color-scheme" content="light dark">
<!-- Inlined, not linked: a status page must not fetch assets from the service
     it monitors, or the branding breaks exactly when people come looking. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%233b82f6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%232563eb%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%226%22%20y%3D%226%22%20width%3D%2212%22%20height%3D%2212%22%20fill%3D%22url%28%23g%29%22%20opacity%3D%22.9%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2210%22%20width%3D%2212%22%20height%3D%2212%22%20fill%3D%22url%28%23g%29%22%20opacity%3D%22.95%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2214%22%20width%3D%2212%22%20height%3D%2212%22%20fill%3D%22url%28%23g%29%22%2F%3E%3C%2Fsvg%3E">

<meta property="og:title" content="SplitOne Status">
<meta property="og:description" content="Live availability for SplitOne.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
  :root {
    --ground:    #F6F8F8;
    --surface:   #FFFFFF;
    --surface-2: #EEF2F2;
    --ink:       #10161A;
    --ink-soft:  #3D4B52;
    --muted:     #6B7C84;
    --rule:      #E0E6E7;
    --rule-hard: #C6D0D2;

    --ok:        #0B7A5C;
    --ok-bar:    #16A97F;
    --degraded:  #9A6510;
    --degr-bar:  #D99A2B;
    --down:      #AF2D22;
    --down-bar:  #DC4A3D;
    --nodata:    #D3DADB;

    --ok-wash:   #0B7A5C14;
    --down-wash: #AF2D2214;

    --f-ui:   "Instrument Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:    #0A0D0E;
      --surface:   #131819;
      --surface-2: #1B2223;
      --ink:       #E7ECED;
      --ink-soft:  #B3BFC3;
      --muted:     #7E8F95;
      --rule:      #212A2C;
      --rule-hard: #333F42;

      --ok:        #43C79B;
      --ok-bar:    #2E9E79;
      --degraded:  #DBA83F;
      --degr-bar:  #B8862A;
      --down:      #F0796B;
      --down-bar:  #C4483B;
      --nodata:    #262F31;

      --ok-wash:   #43C79B1a;
      --down-wash: #F0796B1a;
    }
  }

  :root[data-theme="dark"] {
    --ground:    #0A0D0E;
    --surface:   #131819;
    --surface-2: #1B2223;
    --ink:       #E7ECED;
    --ink-soft:  #B3BFC3;
    --muted:     #7E8F95;
    --rule:      #212A2C;
    --rule-hard: #333F42;
    --ok:        #43C79B;
    --ok-bar:    #2E9E79;
    --degraded:  #DBA83F;
    --degr-bar:  #B8862A;
    --down:      #F0796B;
    --down-bar:  #C4483B;
    --nodata:    #262F31;
    --ok-wash:   #43C79B1a;
    --down-wash: #F0796B1a;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-ui);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 22px 80px;
  }

  /* ---------- header ---------- */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 28px 0 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-decoration: none;
  }
  .brand-mark {
    /* Slightly larger than the old lettermark: the glow filter bleeds past the
       geometry, so the squares read smaller than their box. */
    width: 26px; height: 26px;
    flex: none;
    display: block;
    /* Pulls the optical centre back in line with the wordmark baseline. */
    margin-top: -1px;
  }
  .head-link {
    font-size: 13.5px;
    color: var(--muted);
    text-decoration: none;
    padding: 6px 2px;
    border-bottom: 1px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .head-link:hover { color: var(--ink); border-bottom-color: var(--rule-hard); }
  .head-link:focus-visible { outline: 2px solid var(--ok); outline-offset: 3px; border-radius: 3px; }

  /* ---------- hero ---------- */

  .hero { padding: 52px 0 34px; }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.08;
    text-wrap: balance;
  }
  .sub {
    margin: 0;
    max-width: 56ch;
    color: var(--ink-soft);
    font-size: 15.5px;
  }

  /* ---------- overall banner ---------- */

  .banner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    border: 1px solid var(--rule);
    border-left: 3px solid var(--ok);
    background: var(--surface);
    border-radius: var(--radius);
    margin-bottom: 12px;
  }
  .banner.is-down { border-left-color: var(--down); }
  .banner.is-degraded { border-left-color: var(--degraded); }

  .banner-text {
    font-weight: 500;
    font-size: 16px;
    letter-spacing: -0.01em;
  }
  .banner-time {
    margin-left: auto;
    font-family: var(--f-mono);
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--ok);
    flex: none;
    position: relative;
  }
  .dot::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid var(--ok);
    opacity: 0;
    animation: ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
  }
  .is-down .dot, .is-down .dot::after { background: var(--down); border-color: var(--down); }
  .is-degraded .dot, .is-degraded .dot::after { background: var(--degraded); border-color: var(--degraded); }
  .is-down .dot::after, .is-degraded .dot::after { background: none; }

  @keyframes ping {
    0%   { opacity: .7; transform: scale(.6); }
    70%  { opacity: 0;  transform: scale(1.5); }
    100% { opacity: 0;  transform: scale(1.5); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot::after { animation: none; }
    * { transition: none !important; }
  }

  /* ---------- range switch ---------- */

  .toolbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 34px 0 12px;
  }
  .toolbar h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: var(--f-mono);
  }
  .ranges { display: flex; gap: 2px; }
  .ranges button {
    font-family: var(--f-mono);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--muted);
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 9px;
    cursor: pointer;
    transition: color .15s, background .15s, border-color .15s;
  }
  .ranges button:hover { color: var(--ink); background: var(--surface-2); }
  .ranges button[aria-pressed="true"] {
    color: var(--ink);
    background: var(--surface);
    border-color: var(--rule-hard);
  }
  .ranges button:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }

  /* ---------- service cards ---------- */

  .services { display: flex; flex-direction: column; gap: 10px; }

  .card {
    border: 1px solid var(--rule);
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px 18px 15px;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 15px;
  }
  .card-name {
    font-weight: 600;
    font-size: 15.5px;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-name .pip {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); flex: none;
  }
  .card-name .pip.down { background: var(--down); }
  .card-name .pip.degraded { background: var(--degraded); }
  .card-url {
    display: block;
    font-family: var(--f-mono);
    font-size: 11.5px;
    color: var(--muted);
    text-decoration: none;
    margin-top: 3px;
    word-break: break-all;
  }
  .card-url:hover { color: var(--ink-soft); text-decoration: underline; }

  .metrics {
    margin-left: auto;
    display: flex;
    gap: 26px;
    text-align: right;
    flex: none;
  }
  .metric-label {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .metric-value {
    font-family: var(--f-mono);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .metric-value.ok { color: var(--ok); }
  .metric-value .unit { font-size: 11.5px; color: var(--muted); margin-left: 1px; }

  /* ---------- uptime bar strip ---------- */

  .strip {
    display: flex;
    gap: 2px;
    height: 30px;
    align-items: stretch;
  }
  .day {
    flex: 1 1 0;
    min-width: 0;
    border-radius: 2px;
    background: var(--ok-bar);
    position: relative;
  }
  .day.nodata   { background: var(--nodata); }
  .day.degraded { background: var(--degr-bar); }
  .day.down     { background: var(--down-bar); }

  .day:hover { filter: brightness(1.15); }

  .strip-legend {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--f-mono);
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 7px;
  }
  .strip-legend .mid { color: var(--muted); }

  /* Hide older days first on narrow screens rather than squashing them to
     invisible slivers. 90 bars at 320px would be sub-pixel. */
  @media (max-width: 640px) {
    .day:nth-child(-n+45) { display: none; }
  }
  @media (max-width: 420px) {
    .day:nth-child(-n+60) { display: none; }
  }

  /* ---------- states ---------- */

  .msg {
    border: 1px solid var(--rule);
    background: var(--surface);
    border-radius: var(--radius);
    padding: 22px;
    color: var(--muted);
    font-size: 14.5px;
  }
  .msg.error { border-left: 3px solid var(--down); color: var(--ink-soft); }

  .skeleton {
    height: 104px;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
    background-size: 300% 100%;
    animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer { to { background-position: -300% 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

  /* ---------- footer ---------- */

  footer {
    margin-top: 44px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    align-items: center;
    font-family: var(--f-mono);
    font-size: 11.5px;
    color: var(--muted);
  }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule-hard); }
  footer a:hover { color: var(--ink); }
  footer .spacer { margin-left: auto; }

  @media (max-width: 560px) {
    .card-top { flex-wrap: wrap; }
    .metrics { margin-left: 0; width: 100%; justify-content: flex-start; gap: 30px; text-align: left; }
    footer .spacer { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="brand" href="https://splitone.in">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <defs>
          <filter id="so-glow">
            <feGaussianBlur stdDeviation="1.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <linearGradient id="so-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#2563eb"/>
          </linearGradient>
        </defs>
        <rect x="6" y="6" width="12" height="12" fill="url(#so-grad)" filter="url(#so-glow)" opacity=".9"/>
        <rect x="10" y="10" width="12" height="12" fill="url(#so-grad)" filter="url(#so-glow)" opacity=".95"/>
        <rect x="14" y="14" width="12" height="12" fill="url(#so-grad)" filter="url(#so-glow)"/>
      </svg>
      SplitOne
    </a>
    <a class="head-link" href="https://splitone.in">Back to app &rarr;</a>
  </header>

  <div class="hero">
    <h1>Status</h1>
    <p class="sub">
      Checked every five minutes from GitHub&rsquo;s infrastructure &mdash; independently of the
      servers being tested, so this page stays up even when SplitOne does not.
    </p>
  </div>

  <div id="banner" class="banner">
    <span class="dot" aria-hidden="true"></span>
    <span class="banner-text" id="banner-text">Loading&hellip;</span>
    <span class="banner-time" id="banner-time"></span>
  </div>

  <div class="toolbar">
    <h2>Services</h2>
    <div class="ranges" id="ranges" role="group" aria-label="Uptime window">
      <button type="button" data-range="Day"   aria-pressed="false">24h</button>
      <button type="button" data-range="Week"  aria-pressed="true">7d</button>
      <button type="button" data-range="Month" aria-pressed="false">30d</button>
      <button type="button" data-range="Year"  aria-pressed="false">1y</button>
      <button type="button" data-range=""      aria-pressed="false">all</button>
    </div>
  </div>

  <div class="services" id="services">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <footer>
    <span id="updated">&nbsp;</span>
    <span class="spacer"></span>
    <a href="https://github.com/HarishbarathiS/splitone-status">Source</a>
    <a href="https://upptime.js.org">Powered by Upptime</a>
  </footer>

</div>

<script>
(function () {
  "use strict";

  // The first day this page has real data for. Days before it render as "no
  // data" rather than green -- ninety green bars on one day of history would be
  // a lie, and a status page that lies about the past is worth nothing.
  var MONITORING_SINCE = "2026-09-06";

  var DAYS = 90;
  var state = { range: "Week", sites: [] };

  var el = {
    banner: document.getElementById("banner"),
    bannerText: document.getElementById("banner-text"),
    bannerTime: document.getElementById("banner-time"),
    services: document.getElementById("services"),
    ranges: document.getElementById("ranges"),
    updated: document.getElementById("updated")
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function isoDay(d) { return d.toISOString().slice(0, 10); }

  // Upptime records only downtime, so a day absent from dailyMinutesDown was a
  // day with no incident. That inference is only valid once monitoring started,
  // which is what MONITORING_SINCE guards.
  function buildDays(site) {
    var out = [];
    var today = new Date();
    for (var i = DAYS - 1; i >= 0; i--) {
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      var key = isoDay(d);
      if (key < MONITORING_SINCE) {
        out.push({ date: key, cls: "nodata", label: "no data" });
        continue;
      }
      var down = (site.dailyMinutesDown && site.dailyMinutesDown[key]) || 0;
      var cls = down === 0 ? "" : (down < 30 ? "degraded" : "down");
      var label = down === 0 ? "no downtime" : down + " min down";
      out.push({ date: key, cls: cls, label: label });
    }
    return out;
  }

  function uptimeFor(site) {
    return site["uptime" + state.range] || site.uptime || "—";
  }
  function timeFor(site) {
    var v = site["time" + state.range];
    if (v == null) v = site.time;
    return v == null ? null : v;
  }

  function statusClass(status) {
    if (status === "up") return "";
    if (status === "degraded") return "degraded";
    return "down";
  }

  function renderCard(site) {
    var cls = statusClass(site.status);
    var days = buildDays(site);
    var ms = timeFor(site);

    var bars = days.map(function (d) {
      return '<div class="day ' + d.cls + '" title="' + esc(d.date) + ' — ' + esc(d.label) + '"></div>';
    }).join("");

    return '' +
      '<article class="card">' +
        '<div class="card-top">' +
          '<div>' +
            '<div class="card-name"><span class="pip ' + cls + '"></span>' + esc(site.name) + '</div>' +
            '<a class="card-url" href="' + esc(site.url) + '" rel="noopener">' + esc(site.url) + '</a>' +
          '</div>' +
          '<div class="metrics">' +
            '<div>' +
              '<div class="metric-label">Uptime</div>' +
              '<div class="metric-value ' + (cls ? "" : "ok") + '">' + esc(uptimeFor(site)) + '</div>' +
            '</div>' +
            '<div>' +
              '<div class="metric-label">Response</div>' +
              '<div class="metric-value">' + (ms == null ? "—" : esc(ms) + '<span class="unit">ms</span>') + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="strip" role="img" aria-label="Daily uptime for the last ' + DAYS + ' days">' + bars + '</div>' +
        '<div class="strip-legend"><span>' + DAYS + ' days ago</span><span class="mid">today</span></div>' +
      '</article>';
  }

  function render() {
    var sites = state.sites;
    if (!sites.length) return;

    var down = sites.filter(function (s) { return s.status !== "up"; });
    var banner = el.banner;
    banner.classList.remove("is-down", "is-degraded");

    if (down.length === 0) {
      el.bannerText.textContent = "All systems operational";
    } else if (down.length === sites.length) {
      banner.classList.add("is-down");
      el.bannerText.textContent = "Major outage";
    } else {
      banner.classList.add("is-degraded");
      el.bannerText.textContent = down.length === 1
        ? down[0].name + " is having problems"
        : down.length + " services are having problems";
    }

    el.services.innerHTML = sites.map(renderCard).join("");
  }

  el.ranges.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-range]");
    if (!btn) return;
    state.range = btn.getAttribute("data-range");
    Array.prototype.forEach.call(el.ranges.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String(b === btn));
    });
    render();
  });

  function fail(message) {
    el.banner.classList.add("is-down");
    el.bannerText.textContent = "Status unavailable";
    el.services.innerHTML =
      '<div class="msg error">' + esc(message) +
      ' The app itself may be fine — this only means the status data could not be read.</div>';
  }

  fetch("summary.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("summary.json returned " + r.status);
      return r.json();
    })
    .then(function (data) {
      if (!Array.isArray(data) || !data.length) throw new Error("No services are configured.");
      state.sites = data;
      render();
      var now = new Date();
      el.bannerTime.textContent = "checked " + now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      el.updated.textContent = "Last built " + now.toLocaleString();
    })
    .catch(function (err) {
      fail("Could not load status data: " + err.message + ".");
    });
})();
</script>
</body>
</html>
