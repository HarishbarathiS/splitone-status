owner: HarishbarathiS
repo: splitone-status

sites:
  - name: SplitOne
    url: https://splitone.in

  - name: API
    # The health endpoint, not the API root: it returns 200 with no auth and
    # touches nothing downstream, so a Supabase blip does not show as an API
    # outage. That is the same reason the container healthcheck uses it.
    url: https://api.splitone.in/health

# Incidents open as GitHub Issues assigned here, which is what actually reaches
# your phone -- no extra notification service required.
assignees:
  - HarishbarathiS

status-website:
  # GitHub Pages serves the page at this hostname. Requires a CNAME record:
  #   status.splitone.in  ->  harishbarathis.github.io
  cname: status.splitone.in
  name: SplitOne Status
  introTitle: "SplitOne Status"
  introMessage: >-
    Live availability for SplitOne. Checks run every five minutes from GitHub's
    infrastructure, independently of the servers they are testing -- so this page
    stays up even when SplitOne does not.
  navbar:
    - title: Status
      href: /
    - title: SplitOne
      href: https://splitone.in

# Defaults are sensible; these are spelled out so the cadence is visible rather
# than implied. Uptime checks every 5 minutes is the practical floor for GitHub
# Actions cron -- it queues under load, so treat it as "about 5 minutes".
workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
